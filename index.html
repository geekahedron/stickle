<style>
:root{color-scheme:light dark;--stick:linear-gradient(#f0d29c,#d4a764);--head:#b0413e;--slot:#ffffff0d;--slotline:#ffffff40;--bg:#121213;--fg:#f8f8f8;--muted:#818384;--line:#3a3a3c;--ok:#538d4e;--sel:#b59f3b;font-family:'Helvetica Neue',Arial,sans-serif}
button,a{touch-action:manipulation}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}
.app{min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{position:relative;width:100%;border-bottom:1px solid var(--line);text-align:center;padding:12px}
.logo{color:var(--fg);text-decoration:none;font-weight:800;letter-spacing:.2em;font-size:22px}
.helpbtn{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:1.5px solid #888;background:none;color:#ddd;font-weight:700;cursor:pointer}
main{width:100%;max-width:480px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.muted{color:var(--muted)}a{color:inherit}
.meta{width:100%;display:flex;justify-content:space-between;font-size:14px}.meta a{text-decoration:none}
.tabs{display:flex;gap:8px}.tab{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);font-weight:700;cursor:pointer}
.tab.on{border-color:var(--fg);color:var(--fg)}.tab.ok{background:var(--ok);border-color:var(--ok);color:#fff}.tab.rev{background:#555;color:#fff}
.goal{font-size:18px;text-align:center;margin:0;font-weight:600}
.fit{width:100%;position:relative;margin:12px 0}
.mboard{position:relative;transform-origin:0 0;touch-action:none}
.match,.ghost{touch-action:none;position:absolute;left:0;top:0;height:8px;padding:0;border:0;cursor:pointer;transform-origin:50% 50%;transition:transform .45s cubic-bezier(.3,1.3,.5,1),background .2s,box-shadow .2s,opacity .2s}
.match{background:var(--stick);border-radius:3px;box-shadow:none;opacity:1;filter:none;z-index:2}
.match::after{content:'';position:absolute;right:-3px;top:-2px;width:11px;height:11px;border-radius:50%;background:var(--head);box-shadow:none;filter:none;pointer-events:none}
.match.lifted{box-shadow:0 0 0 2px var(--sel),0 6px 12px #000a;z-index:3}
.match.drag{transition:none;cursor:grabbing;z-index:4}
.mboard.won .match::after{background:var(--head)}
.ghost{background:transparent;border-radius:3px;z-index:1;pointer-events:none;outline:1px dashed var(--slotline);background:var(--slot)}
.ghost.hot{background:#b59f3b88;outline-color:#b59f3b}
.counter{font-size:18px}.hint{font-size:13px;text-align:center;margin:0}
.btn{background:var(--ok);color:#fff;border:0;border-radius:6px;padding:10px 22px;font-weight:700;font-size:15px;cursor:pointer}
.btn.ghostbtn{background:transparent;border:1px solid var(--line);color:var(--fg)}.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}
.okmsg{color:#d9a36a;font-weight:700;margin:0}
.shake{animation:shake .3s}@keyframes shake{25%{translate:-6px}75%{translate:6px}}
.win{text-align:center}.win pre{background:#1e1e20;padding:12px;border-radius:6px;font-family:inherit;white-space:pre-wrap}
.alist{list-style:none;padding:0;margin:0;width:100%}
.alist a{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.alist a:hover{background:#1c1c1e}.anum{color:var(--muted);width:42px}.adate{flex:1}.alist a.done .anum{color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:20px 0}
.modalbox{background:#121213;border:1px solid #333;border-radius:12px;width:min(440px,96vw);position:relative;padding:8px 20px 20px}
.close{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--fg);font-size:24px;cursor:pointer}
.howto{padding-left:18px;line-height:1.45}.howto li{margin:6px 0}
@media (prefers-reduced-motion:reduce){.match,.ghost{transition:none}.shake{animation:none}}
@media (prefers-color-scheme:light){:root{--bg:#fff;--fg:#1a1a1b;--muted:#6e6e70;--line:#d3d6da;--stick:linear-gradient(#d9b071,#b5853f);--slot:#0000000a;--slotline:#00000038}.helpbtn{color:#333}.modalbox{background:#fff;border-color:#ccc}.win pre{background:#f0f0f0}.alist a:hover{background:#f3f3f3}}
</style>

// Engine: reads a matchstick board and checks goals. Also used by scripts/generate.mjs.
// /*ENGINE-BEGIN*/
// Lattice `width` columns wide (boundaries x = 0..width), two rows tall. Slot ids:
//   h0:c h1:c h2:c   horizontal bar over column c at the top / middle / bottom
//   lo:c             lower half-height bar in column c (the second bar of '=')
//   cv:c             short centre vertical in column c (the upright of '+')
//   v0:x v1:x        vertical on boundary x, upper / lower half; shared by neighbouring columns
// Connected groups are read left to right: a lone full boundary = '1'; one column = '+', '=', '-'
// or a seven-segment digit; anything else makes the board invalid. Adjacent digits form one number.
// A '-' at the start, right after '=' or right after '+' is a negative sign (no '--', no '-0').
const Engine = (() => {
  const DIGITS = { abcdef: '0', abdeg: '2', abcdg: '3', bcfg: '4', acdfg: '5', acdefg: '6', abc: '7', abcdefg: '8', abcdfg: '9' }
  const OPS = { lo: '-', 'g+cv': '+', 'g+lo': '=' }
  const SPAN = ['h0', 'h1', 'h2', 'lo', 'cv'], VERT = ['v0', 'v1']
  function slotsOf(width) {
    const out = []
    for (let x = 0; x <= width; x++) for (const k of VERT) out.push(`${k}:${x}`)
    for (let c = 0; c < width; c++) for (const k of SPAN) out.push(`${k}:${c}`)
    return out
  }
  function glyphs(width, occ) {
    const set = occ instanceof Set ? occ : new Set(occ)
    const parent = [...Array(width + 1).keys()], used = new Array(width + 1).fill(false)
    const find = (a) => (parent[a] === a ? a : (parent[a] = find(parent[a])))
    for (const s of set) {
      const [k, n] = s.split(':'), x = +n
      if (k[0] === 'v') used[x] = true
      else { used[x] = used[x + 1] = true; parent[find(x)] = find(x + 1) }
    }
    const out = []
    for (let x = 0; x <= width; x++) {
      if (!used[x] || (x > 0 && used[x - 1] && find(x - 1) === find(x))) continue
      let end = x; while (end + 1 <= width && used[end + 1] && find(end + 1) === find(x)) end++
      const w = end - x, has = (k, n) => set.has(`${k}:${n}`)
      if (w === 0) { if (has('v0', x) && has('v1', x)) { out.push('1'); continue } return null }
      if (w > 1) return null
      const c = x, opParts = ['lo', 'cv'].filter((k) => has(k, c))
      if (opParts.length) {
        if (has('h0', c) || has('h2', c) || VERT.some((k) => has(k, c) || has(k, c + 1))) return null
        const sym = OPS[[has('h1', c) ? 'g' : null, ...opParts].filter(Boolean).join('+')]
        if (!sym) return null; out.push(sym); continue
      }
      const segs = [['a', has('h0', c)], ['b', has('v0', c + 1)], ['c', has('v1', c + 1)], ['d', has('h2', c)],
        ['e', has('v1', c)], ['f', has('v0', c)], ['g', has('h1', c)]].filter((p) => p[1]).map((p) => p[0]).join('')
      if (segs === 'g') { out.push('-'); continue }
      const sym = DIGITS[segs]; if (!sym) return null; out.push(sym)
    }
    return out
  }
  function tokenize(width, occ) {
    const g = glyphs(width, occ); if (!g) return null
    const toks = []
    for (const ch of g) {
      if (/\d/.test(ch) && toks.length && /^\d/.test(toks[toks.length - 1])) toks[toks.length - 1] += ch
      else toks.push(ch)
    }
    return toks
  }
  function evalExpr(t) {
    if (!t.length) return null
    let i = 0, total = 0, op = '+'
    for (;;) {
      let neg = false
      if (t[i] === '-' && (i === 0 || t[i - 1] === '+')) { neg = true; i++ }
      const n = t[i]
      if (n === undefined || !/^\d+$/.test(n) || (n.length > 1 && n[0] === '0') || (neg && n === '0')) return null
      const v = neg ? -Number(n) : Number(n)
      total = op === '+' ? total + v : total - v
      if (++i === t.length) return total
      op = t[i]
      if (op !== '+' && op !== '-') return null
      if (++i === t.length) return null
    }
  }
  function value(width, occ) { const t = tokenize(width, occ); return !t || t.includes('=') ? null : evalExpr(t) }
  function isTrueEquation(width, occ) {
    const t = tokenize(width, occ)
    if (!t || t.filter((x) => x === '=').length !== 1) return false
    const k = t.indexOf('='), l = evalExpr(t.slice(0, k)), r = evalExpr(t.slice(k + 1))
    return l !== null && r !== null && l === r
  }
  function moveCount(start, occ) {
    const s = new Set(start), o = new Set(occ)
    if (s.size !== o.size) return null
    let d = 0; for (const x of o) if (!s.has(x)) d++
    return d
  }
  const render = (width, occ) => { const g = glyphs(width, occ); return g ? g.join('') : '?' }
  function meets(goal, width, occ, best) {
    if (goal.type === 'fix') return isTrueEquation(width, occ)
    const v = value(width, occ)
    if (v === null) return false
    return goal.type === 'target' ? v === goal.target : v === best
  }
  // a board from text: one padding column at each end, one gap column between characters; a '1' sits on one boundary
  const PAT = { 0: 'abcdef', 2: 'abdeg', 3: 'abcdg', 4: 'bcfg', 5: 'acdfg', 6: 'acdefg', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' }
  const SEG = { a: (c) => `h0:${c}`, g: (c) => `h1:${c}`, d: (c) => `h2:${c}`, f: (c) => `v0:${c}`, e: (c) => `v1:${c}`, b: (c) => `v0:${c + 1}`, c: (c) => `v1:${c + 1}` }
  const OPSLOTS = { '+': ['h1', 'cv'], '-': ['h1'], '=': ['h1', 'lo'] }
  function layout(text) { let x = 1; const at = []; for (const ch of text) { at.push(x); x += ch === '1' ? 1 : 2 } return { at, width: x } }
  const widthFor = (text) => layout(text).width
  function boardFrom(text) {
    const { at } = layout(text)
    return [...text].flatMap((ch, i) => {
      const c = at[i]
      if (ch === '1') return [`v0:${c}`, `v1:${c}`]
      if (PAT[ch]) return [...PAT[ch]].map((s) => SEG[s](c))
      return OPSLOTS[ch].map((k) => `${k}:${c}`)
    })
  }
  return { DIGITS, OPS, slotsOf, glyphs, tokenize, evalExpr, value, isTrueEquation, moveCount, render, meets, widthFor, boardFrom }
})()
// /*ENGINE-END*/

// ---------------------------------------------------------------------------------------------
// Dates: puzzles are looked up by the player's local date, like Wordle.
// ---------------------------------------------------------------------------------------------
const dayNum = (iso) => Math.round(Date.parse(iso + 'T00:00:00Z') / 864e5)
const isoOf = (n) => new Date(n * 864e5).toISOString().slice(0, 10)
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` }
const numberOf = (date) => dayNum(date) - dayNum(EPOCH) + 1
const dayFor = (date) => { const n = numberOf(date); const d = PUZZLES[n - 1]; return d && d.date === date ? { ...d, number: n } : null }
const playable = (date) => /^\d{4}-\d{2}-\d{2}$/.test(date) && date <= localToday() && !!dayFor(date)
const fmtDate = (d) => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })

// ---------------------------------------------------------------------------------------------
// Progress (localStorage only): {cur, boards: {id: {pos, hist, solved, revealed, used}}}
// ---------------------------------------------------------------------------------------------
const KEY = (date) => `stickle:${date}`
const load = (date) => { try { return JSON.parse(localStorage.getItem(KEY(date))) } catch { return null } }
const store = (date, st) => { try { localStorage.setItem(KEY(date), JSON.stringify(st)) } catch {} }
const parsePuzzle = (p, i) => ({ id: i + 1, goal: p.goal, width: p.width, best: p.best, start: p.start.split(' '), answer: p.answer.split(' ') })
function statusOf(date) {
  const st = load(date), d = dayFor(date); if (!st || !d) return null
  const bs = d.puzzles.map((_, i) => st.boards[i + 1] || {})
  if (!bs.some((b) => b.solved || b.revealed || (b.hist && b.hist.length))) return null
  return { done: bs.every((b) => b.solved || b.revealed), label: bs.map((b) => (b.solved ? '🔥' : b.revealed ? '💧' : '·')).join('') }
}

// ---------------------------------------------------------------------------------------------
// Game view
// ---------------------------------------------------------------------------------------------
const U = 46, P = 12, ML = U - 8 // column width (= half height), padding, match length (px)
function slotGeom(id) {
  const [k, n] = id.split(':'), c = +n, mx = P + (c + 0.5) * U, mid = P + U
  switch (k) {
    case 'v0': return { x: P + c * U, y: P + U * 0.5, a: 90 }
    case 'v1': return { x: P + c * U, y: P + U * 1.5, a: 90 }
    case 'h0': return { x: mx, y: P, a: 0 }
    case 'h1': return { x: mx, y: mid, a: 0 }
    case 'h2': return { x: mx, y: P + 2 * U, a: 0 }
    case 'lo': return { x: mx, y: mid + U * 0.5, a: 0 }
    case 'cv': return { x: mx, y: mid, a: 90 }
  }
}
const goalText = (g) => {
  const m = `${g.moves} match${g.moves > 1 ? 'es' : ''}`
  return { fix: `Move ${m} to make the equation true`, max: `Move ${m} to make the largest number`, min: `Move ${m} to make the smallest number`, target: `Move ${m} so it equals ${g.target}` }[g.type]
}
const tf = (g, extra = '') => `translate(${g.x - ML / 2}px, ${g.y - 4}px) rotate(${g.a}deg)${extra}`
const $ = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild }

let game = null // the open day: {date, number, qs, st, lift, drag, boardEl, fitEl, scale}

function openGame(date) {
  const d = dayFor(date), qs = d.puzzles.map(parsePuzzle)
  let st = load(date)
  if (!st || !st.boards || qs.some((q) => !st.boards[q.id])) st = { cur: 0, boards: Object.fromEntries(qs.map((q) => [q.id, { pos: [...q.start], hist: [], solved: false }])) }
  game = { date, number: d.number, qs, st, lift: null, drag: null, copied: false }
  renderGame()
}
const save = () => store(game.date, game.st)
const curQ = () => game.qs[game.st.cur]
const curB = () => game.st.boards[curQ().id]

function renderGame() {
  const { qs, st } = game, q = curQ(), b = curB()
  const moves = Engine.moveCount(q.start, b.pos), done = b.solved || b.revealed
  const allDone = qs.every((x) => st.boards[x.id].solved || st.boards[x.id].revealed)
  const view = document.getElementById('view')
  view.innerHTML = ''
  view.append($(`<div class="meta"><span>Stickle #${game.number}</span><a class="muted" href="#/archive">${game.date} · Archive</a></div>`))
  const tabs = $('<div class="tabs"></div>')
  qs.forEach((x, i) => {
    const bx = st.boards[x.id], t = $(`<button class="tab ${i === st.cur ? 'on' : ''} ${bx.solved ? 'ok' : bx.revealed ? 'rev' : ''}">${i + 1}</button>`)
    t.onclick = () => { game.lift = null; st.cur = i; save(); renderGame() }
    tabs.append(t)
  })
  view.append(tabs, $(`<h1 class="goal">${goalText(q.goal)}</h1>`))
  // board
  const BW = q.width * U + 2 * P, BH = 2 * U + 2 * P
  const fitEl = $('<div class="fit"></div>'), boardEl = $(`<div class="mboard ${b.solved ? 'won' : ''}" style="width:${BW}px;height:${BH}px"></div>`)
  fitEl.append(boardEl); view.append(fitEl)
  game.fitEl = fitEl; game.boardEl = boardEl; game.BW = BW; game.BH = BH; game.matchEls = []
  b.pos.forEach((slot, i) => {
    const m = $(`<button class="match" aria-label="match ${slot}"></button>`)
    m.style.width = ML + 'px'; m.onpointerdown = (e) => matchDown(e, i)
    boardEl.append(m); game.matchEls.push(m)
  })
  boardEl.onpointerdown = boardDown
  fit(); updateBoard()
  view.append($(`<div class="counter">Moved: <b data-testid="moves">${moves}</b> / ${q.goal.moves}</div>`))
  if (b.solved) view.append($('<p class="okmsg">Solved! 🔥</p>'))
  else if (b.revealed) view.append($(`<p class="muted">Revealed: ${Engine.render(q.width, b.pos)}</p>`))
  else {
    const row = $('<div class="row"></div>')
    const btn = (label, fn, dis) => { const x = $(`<button class="btn ghostbtn">${label}</button>`); x.disabled = !!dis; x.onclick = fn; row.append(x) }
    btn('Undo', undo, !b.hist.length); btn('Reset', reset); btn('Give up', reveal)
    view.append(row)
  }
  if (done && st.cur < qs.length - 1) { const n = $('<button class="btn">Next puzzle</button>'); n.onclick = () => { st.cur++; save(); renderGame() }; view.append(n) }
  view.append($('<p class="hint muted">Drag a match to a new spot, or tap a match and then tap where it should go. Sticks can form any digit, a 1, +, − or =.</p>'))
  if (allDone) {
    const solved = qs.filter((x) => st.boards[x.id].solved).length
    const used = qs.reduce((a, x) => a + (st.boards[x.id].solved ? st.boards[x.id].used : 0), 0)
    const share = `Stickle #${game.number} — solved in ${used} 🔥\n${qs.map((x) => (st.boards[x.id].solved ? '🔥' : '💧')).join('')} ${solved}/${qs.length}\n${location.origin}${location.pathname}?p=${game.number}`
    const win = $(`<div class="win"><h2>${solved === qs.length ? 'All lit!' : 'Done for today'}</h2><pre></pre></div>`)
    win.querySelector('pre').textContent = share
    const sb = $(`<button class="btn">${game.copied ? 'Copied!' : 'Share'}</button>`)
    sb.onclick = () => {
      if (navigator.share && matchMedia('(pointer:coarse)').matches) navigator.share({ text: share }).catch(() => {})
      else navigator.clipboard?.writeText(share).then(() => { game.copied = true; sb.textContent = 'Copied!' })
    }
    win.append(sb); view.append(win)
  }
}
function fit() {
  if (!game?.fitEl) return
  const avail = game.fitEl.clientWidth || game.BW, s = Math.min(1, avail / game.BW)
  game.scale = s
  game.fitEl.style.height = game.BH * s + 'px'
  game.boardEl.style.transform = `scale(${s})`
  game.boardEl.style.marginLeft = Math.max(0, (avail - game.BW * s) / 2) + 'px'
}
addEventListener('resize', fit)

function empties() { const occ = new Set(curB().pos); return Engine.slotsOf(curQ().width).filter((s) => !occ.has(s)) }
function updateBoard() {
  const b = curB(), { lift, drag } = game
  game.boardEl.querySelectorAll('.ghost').forEach((g) => g.remove())
  if (lift !== null || drag) for (const slot of empties()) {
    const g = $(`<div class="ghost ${drag?.over === slot ? 'hot' : ''}" data-slot="${slot}"></div>`)
    g.style.width = ML + 'px'; g.style.transform = tf(slotGeom(slot)); game.boardEl.append(g)
  }
  b.pos.forEach((slot, i) => {
    const m = game.matchEls[i], g = slotGeom(slot), dg = drag?.i === i
    m.dataset.match = slot; m.setAttribute('aria-label', `match ${slot}`)
    m.className = `match ${lift === i ? 'lifted' : ''} ${dg ? 'drag' : ''}`
    m.style.transform = tf(dg ? { ...g, x: g.x + drag.dx, y: g.y + drag.dy } : g, lift === i ? ' translateY(-3px)' : '')
  })
}
const canLift = (i) => { const q = curQ(), b = curB(); return !(q.start.includes(b.pos[i]) && Engine.moveCount(q.start, b.pos) >= q.goal.moves) }
const nope = () => { const el = game.boardEl; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 350) }
function toBoard(x, y) { const r = game.boardEl.getBoundingClientRect(); return [(x - r.left) / game.scale, (y - r.top) / game.scale] }
function segDist(slot, x, y) { // distance from a client point to a slot's stick, in board px
  const [bx, by] = toBoard(x, y), g = slotGeom(slot), rad = (g.a * Math.PI) / 180, ux = Math.cos(rad), uy = Math.sin(rad)
  const t = Math.max(-ML / 2, Math.min(ML / 2, (bx - g.x) * ux + (by - g.y) * uy))
  return Math.hypot(bx - (g.x + t * ux), by - (g.y + t * uy))
}
function nearest(x, y, i = game.lift ?? game.drag?.i) { // nearest empty slot; ties prefer the moving match's orientation
  const prefA = i != null ? slotGeom(curB().pos[i]).a : 0
  let best = null, bd = U * 0.4
  for (const s of empties()) { const d = segDist(s, x, y) + (slotGeom(s).a === prefA ? 0 : 1.5); if (d < bd) { bd = d; best = s } }
  return best
}
function place(i, slot) {
  const q = curQ(), b = curB()
  const pos = b.pos.map((s, j) => (j === i ? slot : s))
  b.hist = [...b.hist, b.pos]; b.pos = pos
  if (Engine.moveCount(q.start, pos) <= q.goal.moves && Engine.meets(q.goal, q.width, pos, q.best)) { b.solved = true; b.used = Engine.moveCount(q.start, pos) }
  save()
  if (b.solved) renderGame()
  else { updateBoard(); const c = document.querySelector('[data-testid=moves]'); if (c) c.textContent = Engine.moveCount(q.start, pos); const u = [...document.querySelectorAll('.row .btn')][0]; if (u) u.disabled = false }
}
// pointer tap-or-drag: onTap for a tap, onMove while dragging, onDrop(x, y) after a drag (null on cancel)
function pointerDrag(e, { onTap, onStart, onMove, onDrop }) {
  if (e.button !== undefined && e.button !== 0) return
  e.preventDefault()
  const x0 = e.clientX, y0 = e.clientY, id = e.pointerId; let dragging = false
  const move = (ev) => {
    if (ev.pointerId !== id) return
    const dx = ev.clientX - x0, dy = ev.clientY - y0
    if (!dragging && Math.hypot(dx, dy) > 6) { dragging = true; onStart() }
    if (dragging) onMove(dx, dy, ev.clientX, ev.clientY)
  }
  const up = (ev) => {
    if (ev.pointerId !== id) return
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up)
    if (ev.type === 'pointercancel') return onDrop(null, null)
    dragging ? onDrop(ev.clientX, ev.clientY) : onTap()
  }
  addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up)
}
function matchDown(e, i) {
  const b = curB(); if (b.solved || b.revealed) return
  e.stopPropagation()
  // a match is lifted and this press hit another match only by touch fuzz (nearer an empty slot): treat it as the drop
  if (game.lift !== null && game.lift !== i) {
    const s = nearest(e.clientX, e.clientY)
    if (s && segDist(s, e.clientX, e.clientY) < segDist(b.pos[i], e.clientX, e.clientY)) { const k = game.lift; game.lift = null; place(k, s); return }
  }
  pointerDrag(e, {
    onTap: () => { if (game.lift === i) game.lift = null; else if (!canLift(i)) return nope(); else game.lift = i; updateBoard() },
    onStart: () => { if (!canLift(i)) return nope(); game.lift = null; game.drag = { i, dx: 0, dy: 0 }; updateBoard() },
    onMove: (dx, dy, x, y) => { if (!game.drag) return; game.drag = { i, dx: dx / game.scale, dy: dy / game.scale, over: nearest(x, y, i) }; updateBoard() },
    onDrop: (x, y) => {
      if (!game.drag) return; game.drag = null
      const s = x === null ? null : nearest(x, y, i)
      if (s) place(i, s); else updateBoard()
    },
  })
}
function boardDown(e) { // tap on the board (not a match) drops the lifted match into the nearest empty slot
  const b = curB(); if (game.lift === null || b.solved || b.revealed) return
  const s = nearest(e.clientX, e.clientY)
  if (s) { const i = game.lift; game.lift = null; place(i, s) }
}
function undo() { const b = curB(); if (!b.hist.length) return; game.lift = null; b.pos = b.hist.pop(); save(); renderGame() }
function reset() { const b = curB(); game.lift = null; b.pos = [...curQ().start]; b.hist = []; save(); renderGame() }
function reveal() { // move the matches that differ onto the answer, keeping the others where they are
  const q = curQ(), b = curB(), target = new Set(q.answer), start = new Set(q.start)
  const pos = [...q.start], free = q.answer.filter((x) => !start.has(x))
  pos.forEach((p, i) => { if (!target.has(p)) pos[i] = free.shift() })
  game.lift = null; b.pos = pos; b.revealed = true; save(); renderGame()
}

// ---------------------------------------------------------------------------------------------
// Archive, help, routing
// ---------------------------------------------------------------------------------------------
function renderArchive() {
  game = null
  const view = document.getElementById('view'), today = localToday()
  view.innerHTML = '<div class="meta"><a href="#/">← Stickle</a><span class="muted">Archive</span></div><ul class="alist"></ul>'
  const ul = view.querySelector('.alist')
  for (let n = Math.min(PUZZLES.length, numberOf(today)); n >= 1; n--) {
    const date = isoOf(dayNum(EPOCH) + n - 1), s = statusOf(date)
    const li = $(`<li><a href="#/${date}" data-date="${date}" class="${s?.done ? 'done' : ''}"><span class="anum">#${n}</span><span class="adate">${date === today ? 'Today' : fmtDate(date)}</span><span class="astat">${s ? s.label : '<span class="muted">Play</span>'}</span></a></li>`)
    ul.append(li)
  }
}
function renderMissing(msg) { game = null; document.getElementById('view').innerHTML = `<p class="muted">${msg}</p><a class="btn" href="#/archive">Archive</a>` }
function showHelp() {
  const m = document.getElementById('modal')
  m.innerHTML = `<div class="modal" data-testid="help"><div class="modalbox"><button class="close" aria-label="Close" data-testid="help-close">×</button>
    <h2>How to play</h2><ul class="howto">
    <li>Each day has three matchstick puzzles. Every board shows digits and signs made of matches.</li>
    <li>Read the goal above the board: fix the equation, make the largest or smallest number, or hit a target, by moving the given number of matches.</li>
    <li><b>Drag</b> a match to an empty spot (or tap it, then tap the spot) to move it. Undo takes a move back.</li>
    <li>Matches can make any digit, a 1, +, − or =. A − in front of a number makes it negative.</li>
    <li>Solve a board and it lights up 🔥. Light them all, then share your result. A new set arrives every day at midnight.</li>
    </ul><button class="btn" data-close>Play</button></div></div>`
  const close = () => { m.innerHTML = ''; removeEventListener('keydown', esc) }, esc = (e) => e.key === 'Escape' && close()
  m.querySelector('.modal').onclick = (e) => { if (e.target === e.currentTarget || e.target.closest('[data-close],.close')) close() }
  addEventListener('keydown', esc)
  try { localStorage.setItem('stickle:seenHelp', '1') } catch {}
}
document.querySelector('.helpbtn').onclick = showHelp

function route() {
  const p = new URLSearchParams(location.search).get('p')
  if (p && /^\d+$/.test(p)) { history.replaceState(null, '', location.pathname + '#/' + isoOf(dayNum(EPOCH) + +p - 1)) }
  const h = location.hash.replace(/^#\/?/, '').replace(/^stickle\/?/, '') // old #/stickle/... links still work
  const today = localToday()
  if (h === 'archive') return renderArchive()
  const date = h || today
  if (playable(date)) return openGame(date)
  if (date > today) return renderMissing('That puzzle isn’t out yet.')
  renderMissing(h ? 'No puzzle for that day.' : 'No puzzle today. Try the archive.')
}
addEventListener('hashchange', route)
route()
if (!localStorage.getItem('stickle:seenHelp')) showHelp()
</script>
</body>
</html>
